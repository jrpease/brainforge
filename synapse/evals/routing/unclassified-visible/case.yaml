schema_version: "1.0"
name: unclassified-visible
description: >-
  The mystery domain has no kinds and is listed under "unclassified" in the
  manifest — it must stay visible in an overview, never vanish silently.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Give me a one-paragraph overview of what our brain covers."
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - type: regex
    name: mentions-brand
    target: last_message
    pattern: "brand"
    flags: i
  - type: regex
    name: mentions-design
    target: last_message
    pattern: "design"
    flags: i
  - type: regex
    name: mentions-design-system
    target: last_message
    # the design-system domain is the token reference; naming either is naming it
    pattern: "design[- ]system|design[- ]tokens?"
    flags: i
  - type: regex
    name: mentions-tracker
    target: last_message
    pattern: "tracker"
    flags: i
  - type: regex
    name: mentions-mystery
    target: last_message
    pattern: "mystery"
    flags: i
  - type: regex
    name: says-it-is-unroutable
    # the behaviour is flagging that routing cannot reach the mystery domain, in any words (the
    # manifest's label "unclassified" is one, "no kinds" another), said after the domain's name
    # in the same sentence (a dot inside a path is not a sentence end), so routing words about
    # another domain do not pass
    target: last_message
    pattern: "mystery([^.]|\\.(?=\\S)){0,200}?(unclassified|no (declared )?kinds|not (been )?classified|isn'?t classified|unroutable|not routable|(can'?t|cannot|won'?t)[^.]{0,30}(reach|rout)|no intent)"
    flags: i
