schema_version: "1.0"
name: build-prototype
description: >-
  brain-routing should ground a UI-build task in the real design-system
  tokens, not invented colors, and should not over-fetch the tracker.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Build a quick HTML prototype of our checkout confirmation screen. Use our real design system."
  max_turns: 12
  timeout_seconds: 480
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - type: tool_used
    name: reads-design-system
    tool: Read
    input_match: "canon/design|design-system"
    min: 1
  - type: regex
    name: uses-real-brand-color
    # trace, not last_message: the cwd is the brain, which the skill forbids writing into, so
    # the HTML usually lives in a blocked Write and the final message asks where to save it.
    # trace holds tool inputs (never file contents read), so a hex here is the model's own output.
    target: trace
    pattern: "#FF6A00|--acme-orange"
    flags: i
  - type: regex
    name: builds-a-prototype
    # the brand colour alone could come from a Grep; this asserts HTML was actually produced,
    # in a Write or in the reply
    target: trace
    pattern: "<html|<!doctype"
    flags: i
  - type: tool_used
    name: no-tracker-milestones
    tool: Read
    input_match: "tracker/milestones"
    min: 0
    max: 0
    arm: both
  - type: regex
    name: has-announce-line
    target: trace
    pattern: "loaded:.*skipped:"
