schema_version: "1.0"
name: unit-context
description: >-
  A question about another team's product and audience must reach the unit
  domain via the unit-context kind. The Orion domain declares unit-context and
  nothing else, so this case cannot pass through user-archetypes or positioning
  the way an overloaded company-level tag would — which is the point. Guards the
  intent added when a brain was found tagging unit docs with a kind that
  routed nowhere.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Orion is a separate unit here. What does their product actually do, and who is it sold to?"
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - type: tool_used
    name: reads-the-unit-domain
    tool: Read
    input_match: "units/orion"
    min: 1
  - type: regex
    name: names-the-buyer-vertical
    target: last_message
    pattern: "(?i)hvac"
  - type: regex
    name: names-the-size-band
    target: last_message
    pattern: "15\\s*(to|-|–|—)\\s*80"
  - type: regex
    name: names-what-the-product-does
    target: last_message
    pattern: "(?i)(technician|repair crew|dispatch|routing)"
  - type: regex
    name: has-announce-line
    target: last_message
    pattern: "loaded:.*skipped:"
    flags: s
