schema_version: "1.0"
name: launch-email
description: >-
  brain-routing should ground launch copy in brand voice: "customers" not
  "users", no exclamation marks, and no tracker reads for a copy task.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Draft the launch email for our new export feature."
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - type: tool_used
    name: reads-brand-voice
    tool: Read
    input_match: "canon/brand"
    min: 1
  - type: regex
    name: says-customers
    target: last_message
    pattern: "\\bcustomers\\b"
    flags: i
  - type: llm
    name: avoids-users-word-in-copy
    focus: last_message
    criteria: >-
      In the actual drafted email copy (the subject line and body a customer
      would receive), the reader is addressed as "customers", never "users".
      The word "users" does not appear anywhere inside the drafted email
      itself. (The response is allowed to mention, outside the draft, that it
      avoided the word "users" per brand voice — that meta-commentary does
      not count against this criterion.)
  - type: regex
    name: avoids-exclamation-marks
    target: last_message
    pattern: "!"
    match: not_contains
  - type: tool_used
    name: no-tracker-reads
    tool: Read
    input_match: "tracker/"
    min: 0
    max: 0
    arm: both
  - type: regex
    name: has-announce-line
    target: last_message
    pattern: "loaded:.*skipped:"
    flags: s
