name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Git identity for fixture repos
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
      - name: Run tests/*.test.sh
        run: |
          fail=0
          for t in tests/*.test.sh; do
            if bash "$t" > /tmp/out.txt 2>&1; then
              echo "PASS $t"
            else
              echo "FAIL $t"; cat /tmp/out.txt; fail=1
            fi
          done
          exit $fail
